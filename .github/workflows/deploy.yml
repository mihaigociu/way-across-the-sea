# Build the game in game/ and deploy it to GitHub Pages.
# Pull requests are built but not deployed; pushes to main are deployed.
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy

on:
  push:
    branches: [main]
    paths: ['game/**', '.github/workflows/deploy.yml']
  pull_request:
    paths: ['game/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: game

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: game/.nvmrc
          cache: npm
          cache-dependency-path: game/package-lock.json
      - run: npm ci
      - run: npm run build
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: game/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
